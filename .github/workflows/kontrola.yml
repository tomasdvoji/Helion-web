name: Kontrola webu

# Web je statický a stránky se přidávají ručně. Vada v jedné stránce se
# nijak neprojeví — nespadne build, nic nezčervená, jen se ta stránka hůř
# indexuje. Tahle kontrola je proto jediná zpětná vazba, která existuje.
#
# Stalo se to už jednou: všech 55 článků mělo neuzavřený <div> a nikdo
# si toho nevšiml, dokud to nenašel audit.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kontrola:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # sitemap bere lastmod z data commitu, takže potřebuje historii
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 24.–28. 9. 2026 byl na webu form.js se skutečným koncem řádku uvnitř
      # řetězce; prohlížeč skript odmítl a formuláře čtyři dny neposílaly
      # poptávky. Syntaxi JavaScriptu proto kontrolujeme u každého pushe.
      - name: Syntaxe JavaScriptu
        run: |
          chyba=0
          for f in $(git ls-files '*.js'); do
            node --check "$f" || { echo "::error file=$f::syntaktická chyba"; chyba=1; }
          done
          exit $chyba

      - name: SEO a struktura
        run: python tools/seo-kontrola.py .

      - name: Sitemap odpovídá skutečným stránkám
        run: |
          # Porovnává se jen seznam adres. lastmod bere datum z commitu,
          # takže po každém commitu stránky nutně nesedí — hlídat ho tu nejde.
          git show HEAD:sitemap.xml | grep -v '<lastmod>' > /tmp/sitemap-commit.xml
          python tools/sitemap.py .
          grep -v '<lastmod>' sitemap.xml > /tmp/sitemap-nova.xml
          if ! diff -u /tmp/sitemap-commit.xml /tmp/sitemap-nova.xml; then
            echo "::error::sitemap.xml neodpovídá stránkám v repozitáři."
            echo "Spusťte 'python tools/sitemap.py .' a výsledek commitněte."
            exit 1
          fi
          echo "sitemap.xml je aktuální"
